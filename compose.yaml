services:
  postgres:
    image: postgres:18
    ports:
      - "${MEDFLOW_POSTGRES_PORT:-5432}:5432"
    environment:
      TZ: America/Belem
      POSTGRES_USER: medflow
      POSTGRES_PASSWORD: medflow
      POSTGRES_DB: medflow
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    environment:
      TZ: America/Belem
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8085
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "${MEDFLOW_KEYCLOAK_PORT:-8085}:8085"
