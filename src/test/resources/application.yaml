spring:
  application:
    name: medflow
  flyway:
    locations: classpath:db/migration,classpath:db/devdata
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${MEDFLOW_OIDC_ISSUER_URI:http://localhost:8085/realms/medflow}
          jwk-set-uri: ${MEDFLOW_OIDC_JWK_SET_URI:http://localhost:8085/realms/medflow/protocol/openid-connect/certs}
          audiences: ${MEDFLOW_OIDC_AUDIENCE:medflow-api}

medflow:
  security:
    time-zone: America/Belem
